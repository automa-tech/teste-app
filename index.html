<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Comunicação</title>
</head>
<body>

  <h2>Teste de envio para Google Sheets</h2>

  <button onclick="enviarTeste()">ENVIAR TESTE</button>

  <script>
    const urlPlanilha = "https://script.google.com/macros/s/AKfycbyscbOBJVZsnErDvPyD0W9AMa-E8S84yCm4zCvX4z0VPHbyMubDXgh-m6kSih7tooBj/exec";

    function enviarTeste() {
      const dados = {
        setor: "TESTE",
        responsavel: "João",
        itens: [
          {
            codigo: "0020516",
            descricao: "**********************",
            lote: "12345",
            um: "KG",
            qtd: 50.25
          },
          {
            codigo: "0020516",
            descricao: "**********************",
            lote: "12346",
            um: "KG",
            qtd: 16.28
          }
        ]
      };

      const xhr = new XMLHttpRequest();
      xhr.open("POST", urlPlanilha, true);
      xhr.setRequestHeader("Content-Type", "text/plain;charset=UTF-8");

      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          alert("Envio concluído. Confira a planilha.");
          console.log(xhr.responseText);
        }
      };

      xhr.onerror = function() {
        alert("Erro de comunicação.");
      };

      xhr.send(JSON.stringify(dados));
    }
  </script>

</body>
</html>
